# The project site — https://modbusreader.ru/
#
# Pages are Markdown in docs/: page.md is Russian (the default, served at /),
# page.en.md is its English twin (served under /en/). Build locally with
#     pip install -r requirements-docs.txt
#     mkdocs serve
# and it is published by .github/workflows/docs.yml on every push to main.
# The version shown on the site comes from app/version.py (tools/mkdocs_hooks.py).

site_name: ModbusReader
site_url: https://modbusreader.ru/
site_description: >-
  Бесплатная программа для наладки и мониторинга приборов по Modbus RTU
  (RS-485): карта регистров, графики, дашборд, сканер, сниффер, макросы и
  эмулятор Modbus Slave.
site_author: Mercurrial
repo_url: https://github.com/Mercurrial/ModbusReader
repo_name: Mercurrial/ModbusReader
edit_uri: edit/main/docs/
copyright: ModbusReader © 2026 Mercurrial · GNU GPL v3

# docs/ also holds the README pictures and the engineering notes; only the
# notes stay out of the site.
exclude_docs: |
  engineering-notes.md

hooks:
  - tools/mkdocs_hooks.py

# `mkdocs build --strict` (CI) fails on a link to a missing page OR heading.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: images/icon.png
  favicon: images/icon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Тема как в системе
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/download.js
  - javascripts/tools.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mercurrial/ModbusReader
      name: GitHub
  generator: false

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: ModbusReader
          site_description: >-
            Free tool to commission and monitor Modbus RTU (RS-485) devices:
            register map, live trends, dashboard, bus scanner, sniffer,
            macros and a Modbus slave simulator.
          theme:
            palette:
              - media: "(prefers-color-scheme)"
                toggle:
                  icon: material/brightness-auto
                  name: Follow the system theme
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Light theme
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Dark theme
          nav_translations:
            Главная: Home
            Начало работы: Getting started
            Основы Modbus: Modbus basics
            Руководство: User guide
            Примеры: Examples
            Онлайн-инструменты: Online tools
            Помощь: Help

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная: index.md
  - Начало работы:
      - install.md
      - quickstart.md
      - connect.md
      - compare.md
  - Основы Modbus:
      - modbus/index.md
      - modbus/addressing.md
      - modbus/data-types.md
      - modbus/functions.md
  - Руководство:
      - guide/index.md
      - guide/register-map.md
      - guide/map-editor.md
      - guide/projects.md
      - guide/trends.md
      - guide/dashboard.md
      - guide/console.md
      - guide/scanner.md
      - guide/sniffer.md
      - guide/logger.md
      - guide/snapshots.md
      - guide/slave.md
      - guide/macros.md
      - guide/settings.md
  - Примеры:
      - examples/index.md
      - examples/macros.md
      - examples/test-scada.md
      - examples/datasheet-import.md
      - examples/dashboard-automation.md
      - examples/line-debugging.md
  - Онлайн-инструменты:
      - tools/index.md
      - tools/crc.md
      - tools/converter.md
      - tools/address.md
  - Помощь:
      - troubleshooting.md
      - contributing.md
