# The test suite on Linux and macOS (Windows is where the releases are built
# and tested by hand). Each run also photographs every screen headless
# (tools/ui_snapshots.py) and keeps the pictures as an artifact, to see how
# the window looks with that system's fonts.
#
# Linux runs on every push to main. macOS only when started by hand
# (Actions → tests → Run workflow) or for a version tag: in a private
# repository its minutes are billed ten times over.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A job's "if" cannot see the matrix, so the list itself depends on
        # how the run was started.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu-core fonts-noto-core

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Screens
        if: always()
        run: python tools/ui_snapshots.py snapshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-${{ matrix.os }}
          path: snapshots/
          if-no-files-found: ignore
          retention-days: 14
