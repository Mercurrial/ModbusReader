# Linux and macOS builds. PyInstaller does not cross-compile, so each is
# made on its own runner by tools/build_unix.py, then STARTED: the build is
# kept only if the program is still running 20 seconds later, and a screen
# shot of it is kept with the build (artifacts). Windows builds are made by
# hand with tools/build_installer.py.
#
# Runs for a version tag and by hand (Actions → build → Run workflow).
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The oldest supported Ubuntu: an AppImage runs on systems with the same
    # or a NEWER glibc than the one it was built on, never an older one.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"     # no FUSE on the runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (Qt's xcb platform, a virtual screen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            fonts-dejavu-core xvfb imagemagick

      - name: Dependencies (the pinned versions)
        run: python -m pip install -r requirements-dev.txt

      - name: appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build
        run: python tools/build_unix.py --appimagetool ./appimagetool

      - name: Start it
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            ./dist/ModbusReader-*.AppImage & pid=$!
            sleep 20
            import -window root screen-linux.png
            kill -0 $pid || { echo "::error::the program exited"; exit 1; }
            kill $pid; wait $pid || true'
          if [ -s "$XDG_CONFIG_HOME/ModbusReader/modbusreader_errors.log" ]; then
            cat "$XDG_CONFIG_HOME/ModbusReader/modbusreader_errors.log"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux
          path: |
            dist/*.AppImage
            screen-linux.png
          if-no-files-found: ignore
          retention-days: 30

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies (the pinned versions)
        run: python -m pip install -r requirements-dev.txt

      - name: Build
        run: python tools/build_unix.py

      - name: Start it
        run: |
          ./dist/ModbusReader.app/Contents/MacOS/ModbusReader & pid=$!
          sleep 20
          screencapture -x screen-macos.png || true
          kill -0 $pid || { echo "::error::the program exited"; exit 1; }
          kill $pid; wait $pid || true
          log="$HOME/Library/Application Support/ModbusReader/modbusreader_errors.log"
          if [ -s "$log" ]; then cat "$log"; exit 1; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos
          path: |
            dist/*.zip
            screen-macos.png
          if-no-files-found: ignore
          retention-days: 30
