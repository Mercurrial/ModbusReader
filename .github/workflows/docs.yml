# The project site — https://mercurrial.github.io/ModbusReader/
#
# Builds mkdocs.yml (Markdown in docs/, RU + EN) and publishes it to GitHub
# Pages on every push to main that touches the site. `--strict` fails the
# build on a broken link or a link to a missing heading, so a bad page never
# goes live. The version on the site is read from app/version.py, so a
# release republishes it too.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/mkdocs_hooks.py"
      - "app/version.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a
# deployment half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      # WebP versions of the pictures take minutes to encode; they only
      # change when a picture or the encoder settings do.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/webp
          key: webp-${{ hashFiles('docs/images/**', 'tools/mkdocs_hooks.py') }}
          restore-keys: webp-

      - run: mkdocs build --strict
        env:
          MKDOCS_WEBP_CACHE: ${{ runner.temp }}/webp

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
